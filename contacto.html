<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-gray-900 text-white p-4">
        <ul class="flex gap-6 list-none">
            <li><a href="index.html" class="text-gray-300 hover:text-white">Inicio</a></li>
            <li><a href="servicios.html" class="text-gray-300 hover:text-white">Servicios y catálogo</a></li>
            <li><a href="contacto.html" class="text-white font-semibold">Contacto</a></li>
        </ul>
    </nav>

    <main class="max-w-xl mx-auto p-6 flex-1">
        <h1 class="text-4xl font-bold mb-6">Contacto</h1>

        <section class="bg-white p-6 rounded shadow">
            <h2 class="text-2xl font-semibold mb-4">Escríbenos</h2>
            <form action="/enviar" method="post" class="space-y-4">
                <div>
                    <label for="nombre" class="block font-medium mb-1">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required
                           class="w-full border border-gray-300 rounded p-2">
                </div>
                <div>
                    <label for="email" class="block font-medium mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full border border-gray-300 rounded p-2">
                </div>
                <div>
                    <label for="mensaje" class="block font-medium mb-1">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required minlength="10"
                              class="w-full border border-gray-300 rounded p-2"></textarea>
                </div>
                <button type="submit" class="bg-gray-900 text-white px-6 py-2 rounded hover:bg-gray-700">
                    Enviar
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-gray-900 text-white text-center p-4">
        <p>&copy; 2026 Barbería Calviño</p>
    </footer>

</body>
